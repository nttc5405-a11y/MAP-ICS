<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2933">
<title>案件圖管系統・現場回報</title>
<meta name="description" content="現場人員用的手機回報頁：任務、回報、傷患。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="案件圖管系統">
<meta property="og:title" content="案件圖管系統・現場回報">
<meta property="og:description" content="現場人員用的手機回報頁：任務、回報、傷患。">
<meta property="og:url" content="https://nttc5405-a11y.github.io/MAP-ICS/field.html">
<meta property="og:image" content="https://nttc5405-a11y.github.io/MAP-ICS/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://nttc5405-a11y.github.io/MAP-ICS/og-image.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/field.css?v=20261006g">
</head>
<body>
<header id="fhead" hidden>
  <div class="fh-top">
    <div class="fh-case"><span id="fh-type" class="tag"></span><b id="fh-case"></b></div>
    <div class="fh-me" id="fh-me"></div>
  </div>
  <div class="fh-mode">
    <button id="m-map" class="mode-btn">🗺 地圖</button>
    <button id="m-list" class="mode-btn">📋 清單<i id="dot" class="dot" hidden></i></button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>

<main id="views">
  <!-- 加入案件 -->
  <section id="v-join" class="view" hidden></section>

  <!-- 清單模式 -->
  <section id="v-list" class="view" hidden>
    <div id="tasks"></div>
    <div id="detail" hidden></div>
    <div id="cas-view" hidden></div>
  </section>

  <!-- 地圖模式 -->
  <section id="v-map" class="view mapview" hidden>
    <div id="fmap"></div>
    <button id="gps-btn" class="fab" title="回到我的位置">◎</button>
    <button id="base-btn" class="fab fab2" title="切換底圖">🛰</button>
    <button id="zl-btn" class="drawer-btn">區域清單 ▲</button>
    <div id="zsheet" class="sheet" hidden></div>
    <div id="zdrawer" class="sheet drawer" hidden></div>
  </section>
</main>

<footer id="ffoot" hidden>
  <nav id="ftabs" class="ftabs">
    <button data-ft="tasks" class="on">📋 任務</button>
    <button data-ft="cas">🚑 傷患<i id="cas-n" class="cnt-dot" hidden></i></button>
  </nav>
  <div class="foot-btns">
    <button id="btn-report" class="big-btn">📝 回報狀況</button>
    <button id="btn-cas" class="big-btn cas">🚑 回報傷患</button>
  </div>
</footer>

<!-- 回報表單 -->
<div id="rsheet" class="overlay" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js?v=20261006g"></script>
<script src="js/util.js?v=20261006g"></script>
<script src="js/api.js?v=20261006g"></script>
<script src="js/field.js?v=20261006g"></script>
</body>
</html>
