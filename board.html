<link rel="stylesheet" href="css/board.css?v=20261006g">
</head>
<body>
<header id="bhead">
  <span id="b-type" class="tag"></span>
  <h1 id="b-name">載入中…</h1>
  <span id="b-place" class="sub"></span>
  <span id="b-closed" class="closed" hidden>已結案</span>
  <div class="spacer"></div>
  <div class="clock"><div id="clock">--:--:--</div><div id="b-upd" class="sub"></div></div>
</header>
<div id="mq-board" class="marquee" hidden><span></span></div>
<div id="bmain">
  <aside id="side">
    <section class="stats" id="st-top"></section>
    <section class="fold" data-k="cas"><h2>傷患<span class="cnt" id="n-cas"></span></h2><div id="st-cas"></div></section>
    <section class="fold grow" data-k="tasks"><h2>任務<span class="cnt" id="n-tasks"></span></h2><div id="st-tasks"></div></section>
    <section class="fold" data-k="reps"><h2>最近回報<span class="cnt" id="n-reps"></span></h2><div id="st-reps"></div></section>
  </aside>
  <div id="bmap"></div>
</div>
<div id="bmsg" class="bmsg" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/config.js?v=20261006g"></script>
<script src="js/util.js?v=20261006g"></script>

<script src="js/board.js?v=20261006g"></script>
</body>
